# Project-wide Gradle settings.
# Specifies the JVM arguments used for the daemon process with optimized heap and garbage collection.
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=768m -XX:+UseG1GC -Dfile.encoding=UTF-8

# Enables parallel build execution and caching to reduce memory pressure during rebuilds
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.vfs.watch=true
org.gradle.configuration-cache=true

# Android & Kotlin optimizations
android.useAndroidX=true
kotlin.code.style=official
kotlin.incremental=true
